[project]
name = "overbias"
version = "0.1.0"
description = "Overestimation bias of DDPG and TD3 on LunarLander, with or without Layer Normalization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rl-mind>=0.2.4",
    "torch>=2.14.0",
    "gymnasium[box2d]>=1.3.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "matplotlib>=3.11.2",
    "joblib>=1.5",
    "ipykernel>=7.3.0",
    "nbconvert>=7.16",
]

[tool.uv]
package = false
